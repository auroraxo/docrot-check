name: "docrot-check"
description: "Scan README/docs for dead image references (broken external images, missing in-repo files) directly in CI."
author: "Aurora (auroraxo)"
branding:
  icon: "image"
  color: "red"

inputs:
  root:
    description: "Repository root to scan, relative to the workspace."
    default: "."
  fail-on-broken:
    description: "Exit non-zero when a broken reference is found (true) or only report (false)."
    default: "false"
  check-idl-freshness:
    description: "Run a Solana program / IDL freshness scan (declare_id!, Anchor.toml, idl/*.json vs on-chain accounts via JSON-RPC)."
    default: "false"
  idl-cluster:
    description: "Solana cluster for the IDL freshness check: 'mainnet', 'devnet', or a full JSON-RPC URL."
    default: "mainnet"
  idl-fail-on-rot:
    description: "Exit non-zero when IDL freshness rot is found (only relevant when check-idl-freshness is true)."
    default: "false"
  idl-report-path:
    description: "Path (relative to the workspace) where the IDL freshness JSON report is written."
    default: "idl-freshness-report.json"
  report-path:
    description: "Path (relative to the workspace) where the JSON report is written."
    default: "docrot-report.json"
  upload-report:
    description: "Upload the JSON report as a workflow artifact named docrot-report."
    default: "true"

outputs:
  report-path:
    description: "Path of the image-rot JSON report."
    value: ${{ steps.scan.outputs.report-path }}
  broken-total:
    description: "Number of confirmed broken image references."
    value: ${{ steps.scan.outputs.broken-total }}
  idl-report-path:
    description: "Path of the IDL-freshness JSON report (only when check-idl-freshness is true)."
    value: ${{ steps.idl.outputs.idl-report-path }}
  idl-rot-total:
    description: "Number of confirmed IDL / program-ID rot findings (only when check-idl-freshness is true)."
    value: ${{ steps.idl.outputs.idl-rot-total }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      # Pinned by immutable SHA (mutable @v5 would let a re-tagged release run
      # code in the caller's job without the workflow author noticing).
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Check out docrot (scanner)
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: auroraxo/docrot
        # Immutable SHA pin (rev of docrot main at first adoption PR review);
        # mutable refs would let a scanner update run without a workflow change.
        ref: 4d1ec6fbb1c82bf8f6488aa98f2c44dd5b4ffa5f
        path: .docrot-tool
        persist-credentials: false

    - name: Run docrot scan
      id: scan
      shell: bash
      run: |
        set -uo pipefail
        args=()
        if [ "${{ inputs.fail-on-broken }}" = "true" ]; then
          args+=(--fail-on-broken)
        fi
        python3 .docrot-tool/scan_local.py "${{ inputs.root }}" "${{ inputs.report-path }}" "${args[@]+"${args[@]}"}"
        status=$?
        # Surface the headline numbers on the step summary and in outputs.
        python3 - "${{ inputs.report-path }}" >> "$GITHUB_STEP_SUMMARY" <<'PY'
        import json, sys
        s = json.load(open(sys.argv[1]))
        print("## docrot-check")
        print("")
        print("| metric | value |")
        print("| --- | --- |")
        for k in ("markdownFilesScanned", "imageRefs", "uniqueImages", "externalThirdParty",
                  "externalThirdPartyBroken", "missingInRepo", "unresolvable", "brokenTotal"):
            print("| %s | %s |" % (k, s.get(k)))
        broken = s.get("images", [])
        dead = [i for i in broken if i.get("broken")]
        if dead:
            print("")
            print("**Broken references:**")
            for i in dead:
                loc = ", ".join(f"`{p}`" for p, _ in i.get("refs", []))
                print(f"- `{i['target']}` ({loc})")
        PY
        {
          echo "report-path=${{ inputs.report-path }}"
          echo "broken-total=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('brokenTotal',0))" "${{ inputs.report-path }}")"
        } >> "$GITHUB_OUTPUT"
        exit $status

    - name: Run IDL freshness scan
      if: inputs.check-idl-freshness == 'true'
      id: idl
      shell: bash
      run: |
        set -uo pipefail
        idl_args=(--cluster "${{ inputs.idl-cluster }}"
                  --report "${{ inputs.idl-report-path }}")
        if [ "${{ inputs.idl-fail-on-rot }}" = "true" ]; then
          idl_args+=(--fail-on-rot)
        fi
        # github.action_path = this action's own checkout; the target repo's
        # workspace has no scripts/ dir when a foreign repo adopts the action.
        python3 "${{ github.action_path }}/scripts/idl_freshness.py" "${{ inputs.root }}" "${idl_args[@]+"${idl_args[@]}"}"
        idl_status=$?
        python3 - "${{ inputs.idl-report-path }}" >> "$GITHUB_STEP_SUMMARY" <<'PY'
        import json, sys
        s = json.load(open(sys.argv[1]))
        print("")
        print("## idl-freshness")
        print("")
        print("| metric | value |")
        print("| --- | --- |")
        print("| cluster | %s |" % s.get("cluster"))
        for k in ("rustFiles", "anchorToml", "idlJson"):
            print("| %s scanned | %s |" % (k, s.get("scanned", {}).get(k, 0)))
        print("| declarations | %s |" % len(s.get("declarations", [])))
        print("| on-chain checked | %s |" % len(s.get("onChain", [])))
        print("| rot | %s |" % s.get("rotTotal", 0))
        print("| unresolvable | %s |" % s.get("unresolvableTotal", 0))
        for f in s.get("findings", []):
            loc = f.get("file") or f.get("programId", "?")
            if f.get("line"):
                loc = "%s:%s" % (loc, f["line"])
            print("- `%s` — %s (%s)" % (f["kind"], f["message"], loc))
        for u in s.get("unresolvable", []):
            print("- unresolved: %s — %s" % (u.get("programId") or u.get("file"),
                                            u["reason"]))
        PY
        {
          echo "idl-report-path=${{ inputs.idl-report-path }}"
          echo "idl-rot-total=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('rotTotal',0))" "${{ inputs.idl-report-path }}")"
        } >> "$GITHUB_OUTPUT"
        exit $idl_status

    - name: Upload IDL freshness report
      if: inputs.check-idl-freshness == 'true' && inputs.upload-report == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: idl-freshness-report
        path: ${{ inputs.idl-report-path }}
        if-no-files-found: ignore

    - name: Upload report
      if: inputs.upload-report == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: docrot-report
        path: ${{ inputs.report-path }}
        if-no-files-found: ignore
